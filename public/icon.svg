<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Eagle Wing & Audio Wave Visual Concept -->
  <g transform="translate(40, 40) scale(0.84)">
    <!-- Stylized Eagle Head & Beak Silhouette with Soundwaves -->
    <path d="M256 60 C 170 60, 90 120, 70 210 C 60 255, 75 300, 110 330 C 105 320, 100 290, 115 260 C 130 230, 170 200, 220 200 C 235 200, 260 210, 275 230 C 290 250, 290 280, 270 300 C 250 320, 220 330, 190 330 C 160 330, 135 320, 120 310 C 130 350, 170 410, 256 420 C 330 420, 390 370, 420 310 C 450 250, 440 170, 390 120 C 355 80, 310 60, 256 60 Z" 
          fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Stylized Sharp Eagle Beak / Dynamic Audio Play Glyph -->
    <polygon points="230,160 360,240 230,320" fill="#090A0F" opacity="0.95"/>
    <polygon points="234,175 340,240 234,305" fill="url(#goldGrad)"/>
    
    <!-- Sound bars / Equalizer crest -->
    <rect x="80" y="180" width="14" height="60" rx="7" fill="url(#goldGrad)" opacity="0.7"/>
    <rect x="105" y="140" width="14" height="100" rx="7" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="390" y="140" width="14" height="100" rx="7" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="415" y="180" width="14" height="60" rx="7" fill="url(#goldGrad)" opacity="0.7"/>
  </g>

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="450" font-family="'Outfit', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MP3 KID</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#F59E0B" text-anchor="middle" letter-spacing="3">THE EAGLE ICON MUSIC</text>
</svg>
